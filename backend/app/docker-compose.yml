name : renderhavenshop

services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: vikram
      POSTGRES_PASSWORD: vikram_2003
      POSTGRES_DB: renderhavenshop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
